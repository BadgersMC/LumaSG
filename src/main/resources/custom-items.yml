# LumaSG Custom Items Configuration
# This file defines special custom items with unique behaviors in Survival Games

# Global settings for custom items
settings:
  # Whether custom items are enabled
  enabled: true
  
  # Whether to cleanup custom items when games end
  cleanup-on-game-end: true
  
  # Whether to track custom item usage for statistics
  track-usage: true

# Custom items organized by categories
items:
  # === TRACKING ITEMS ===
  player_tracker:
    # Basic item properties
    material: COMPASS
    name: "<gradient:#e74c3c:#f39c12><bold>🎯 Player Tracker</bold></gradient>"
    lore:
      - "<gray>A mystical compass that points"
      - "<gray>to the nearest enemy player"
      - ""
      - "<yellow>• <white>Points to closest player 🧭"
      - "<yellow>• <white>Updates every 2 seconds ⏰"
      - "<yellow>• <white>50 block range 📏"
      - "<yellow>• <red>Reveals your location too! 👁️"
      - ""
      - "<red>Hold to track enemies"
      - "<gold>Use strategically!"
    unbreakable: true
    item-flags:
      - HIDE_ATTRIBUTES
      - HIDE_UNBREAKABLE
    custom-model-data: 2001
    
    # Custom item behavior settings
    behavior:
      type: PLAYER_TRACKER
      
      # Tracking settings
      update-interval: 40        # Ticks (2 seconds)
      max-range: 50             # Blocks
      
      # Visual settings
      show-distance: true
      show-direction: true
      particle-effects: true
      
      # Balancing settings
      reveals-user: true        # User shows up on other trackers
      cooldown: 5               # Seconds between uses
      
    # Loot table integration - Updated to use tier-weights
    loot:
      enabled: true
      tier-weights:
        common: 8.0         # Common in basic chests
        uncommon: 12.0      # More common in mid-tier
        rare: 6.0           # Less common in rare (better items available)
      min-amount: 1
      max-amount: 1
      
    # Persistent data for identification
    persistent-data:
      item-type: "custom_item"
      custom-id: "player_tracker"
      category: "utility"

  # === COMBAT ITEMS ===
  knockback_stick:
    # Basic item properties
    material: STICK
    name: "<gradient:#8e44ad:#9b59b6><bold>⚡ Knockback Stick</bold></gradient>"
    lore:
      - "<gray>A magically enhanced stick that"
      - "<gray>sends enemies flying backwards"
      - ""
      - "<yellow>• <white>Powerful knockback effect 💥"
      - "<yellow>• <white>No damage dealt ❤️"
      - "<yellow>• <white>Perfect for crowd control 🛡️"
      - "<yellow>• <white>Great for escaping danger 🏃"
      - ""
      - "<red>Hit enemies to knock them back"
      - "<purple>Non-lethal but effective!"
    unbreakable: true
    enchantments:
      knockback: 5
    item-flags:
      - HIDE_ATTRIBUTES
      - HIDE_UNBREAKABLE
      - HIDE_ENCHANTS
    custom-model-data: 2002
    
    # Custom item behavior settings
    behavior:
      type: KNOCKBACK_STICK
      
      # Knockback settings
      knockback-strength: 3.0   # Knockback multiplier
      vertical-boost: 0.5       # Upward velocity
      
      # Damage settings
      base-damage: 0.0          # No damage dealt
      
      # Effect settings
      particle-effects: true
      sound-effects: true
      
      # Cooldown to prevent spam
      cooldown: 1               # Seconds
      
    # Loot table integration - Updated to use tier-weights
    loot:
      enabled: true
      tier-weights:
        common: 15.0        # Very common in basic chests
        uncommon: 10.0      # Common in mid-tier
        rare: 4.0           # Less common in rare chests
      min-amount: 1
      max-amount: 1
      
    # Persistent data for identification
    persistent-data:
      item-type: "custom_item"
      custom-id: "knockback_stick"
      category: "combat"

  # === EXPLOSIVE ITEMS ===
  fire_bomb:
    # Basic item properties
    material: TNT
    name: "<gradient:#ff6b35:#f7931e><bold>🔥 Fire Bomb</bold></gradient>"
    lore:
      - "<gray>A volatile explosive that erupts"
      - "<gray>in a blaze of destructive fire"
      - ""
      - "<yellow>• <white>2.5 second fuse time ⏱️"
      - "<yellow>• <white>Creates fire in 3-7 block radius"
      - "<yellow>• <white>Fire lasts for 3 seconds"
      - "<yellow>• <red>No block damage"
      - ""
      - "<red>Right-click to throw"
      - "<dark_red>Handle with extreme care!"
    custom-model-data: 2003
    
    # Custom item behavior settings
    behavior:
      type: FIRE_BOMB
      
      # Explosion settings
      fuse-time: 50          # Ticks (2.5 seconds)
      fire-radius-min: 3
      fire-radius-max: 7
      fire-duration: 60      # Ticks (3 seconds)
      
      # Throwing settings
      throw-velocity: 1.2
      gravity-effect: true
      
      # Safety settings
      damage-thrower: false
      block-damage: false
      
    # Loot table integration - Updated to use tier-weights
    loot:
      enabled: true
      tier-weights:
        common: 6.0         # Uncommon in basic chests
        uncommon: 15.0      # Common in mid-tier
        rare: 18.0          # Very common in rare chests
      min-amount: 1
      max-amount: 2
      
    # Persistent data for identification
    persistent-data:
      item-type: "custom_item"
      custom-id: "fire_bomb"
      category: "explosive"

  poison_bomb:
    # Basic item properties
    material: TNT
    name: "<gradient:#9b59b6:#8e44ad><bold>☠️ Poison Bomb</bold></gradient>"
    lore:
      - "<gray>A sinister device that releases"
      - "<gray>a toxic cloud upon detonation"
      - ""
      - "<yellow>• <white>2 second fuse time ⏱️"
      - "<yellow>• <white>5 block poison radius"
      - "<yellow>• <white>Poison II for 5 seconds"
      - "<yellow>• <red>No block damage"
      - ""
      - "<red>Right-click to throw"
      - "<dark_purple>Toxic and dangerous!"
    custom-model-data: 2004
    
    # Custom item behavior settings
    behavior:
      type: POISON_BOMB
      
      # Explosion settings
      fuse-time: 40          # Ticks (2 seconds)
      effect-radius: 5
      poison-duration: 100   # Ticks (5 seconds)
      poison-amplifier: 1    # Poison II
      
      # Throwing settings
      throw-velocity: 1.0
      gravity-effect: true
      
      # Safety settings
      damage-thrower: false
      block-damage: false
      
    # Loot table integration - Updated to use tier-weights
    loot:
      enabled: true
      tier-weights:
        common: 5.0         # Uncommon in basic chests
        uncommon: 12.0      # Common in mid-tier
        rare: 15.0          # Very common in rare chests
      min-amount: 1
      max-amount: 1
      
    # Persistent data for identification
    persistent-data:
      item-type: "custom_item"
      custom-id: "poison_bomb"
      category: "explosive"

  # === TACTICAL ITEMS ===
  airstrike:
    material: SPYGLASS
    name: "<gradient:#ff0000:#ff6600><bold>🎯 Airstrike Designator</bold></gradient>"
    lore:
      - "<gray>A targeting device that calls"
      - "<gray>a devastating meteor barrage"
      - ""
      - "<yellow>• <white>Hold spyglass to charge 🔭"
      - "<yellow>• <white>3.5 second charge time ⏱️"
      - "<yellow>• <white>5 meteor barrage (1 in deathmatch) ☄️"
      - "<yellow>• <red>You are NOT immune to the blast! 💀"
      - ""
      - "<red>Hold right-click to aim and charge"
      - "<dark_red>Extremely powerful!"
    unbreakable: true
    item-flags:
      - HIDE_ATTRIBUTES
      - HIDE_UNBREAKABLE
    custom-model-data: 2006

    behavior:
      type: AIRSTRIKE
      charge-time-ticks: 70
      max-range: 80
      cancel-on-damage: false
      blast-radius: 18
      meteor-count: 5
      deathmatch-meteor-count: 1
      meteor-delay-ticks: 30
      warning-duration-ticks: 60
      lock-on-duration-ticks: 10
      explosion-radius: 4
      explosion-damage: 6.0
      debris-count-multiplier: 5

    loot:
      enabled: true
      tier-weights:
        common: 0.0         # Never in basic chests
        uncommon: 1.0        # Very rare in mid-tier
        rare: 5.0            # Uncommon in rare chests
      min-amount: 1
      max-amount: 1

    persistent-data:
      item-type: "custom_item"
      custom-id: "airstrike"
      category: "tactical"

  smoke_grenade:
    material: SNOWBALL
    name: "<gradient:#aaaaaa:#666666><bold>💨 Smoke Grenade</bold></gradient>"
    lore:
      - "<gray>A tactical grenade that deploys"
      - "<gray>a dense smoke cloud on impact"
      - ""
      - "<yellow>• <white>16 block smoke radius 💨"
      - "<yellow>• <white>10 second duration ⏱️"
      - "<yellow>• <white>Blocks nametag visibility 👁️"
      - "<yellow>• <white>Great for escaping or ambushing 🛡️"
      - ""
      - "<red>Right-click to throw"
      - "<gray>Use smoke to your advantage!"
    custom-model-data: 2007

    behavior:
      type: SMOKE_GRENADE
      radius: 16
      duration-ticks: 200
      fade-duration-ticks: 40
      particle-tick-rate: 2
      visibility-check-rate: 4
      particle-density: 80
      ambient-sound-interval: 20

    loot:
      enabled: true
      tier-weights:
        common: 4.0         # Uncommon in basic chests
        uncommon: 10.0       # Common in mid-tier
        rare: 8.0            # Common in rare chests
      min-amount: 1
      max-amount: 2

    persistent-data:
      item-type: "custom_item"
      custom-id: "smoke_grenade"
      category: "tactical"

  glider:
    material: FEATHER
    name: "<gradient:#87ceeb:#4169e1><bold>🪶 Glider Feather</bold></gradient>"
    lore:
      - "<gray>An enchanted feather that grants"
      - "<gray>the power of elytra flight"
      - ""
      - "<yellow>• <white>Hold feather while airborne 🪶"
      - "<yellow>• <white>15 second max glide time ⏱️"
      - "<yellow>• <white>No fall damage on landing ❤️"
      - "<yellow>• <white>Firework boost blocked 🚫"
      - ""
      - "<red>Jump and hold feather to glide"
      - "<aqua>Soar above the competition!"
    custom-model-data: 2008

    behavior:
      type: GLIDER
      max-duration-ticks: 300
      min-airtime-ticks: 10
      landing-fall-damage: false
      block-firework-boost: true

    loot:
      enabled: true
      tier-weights:
        common: 3.0         # Uncommon in basic chests
        uncommon: 8.0        # Common in mid-tier
        rare: 10.0           # Common in rare chests
      min-amount: 1
      max-amount: 1

    persistent-data:
      item-type: "custom_item"
      custom-id: "glider"
      category: "tactical"

  # === AIRDROP ITEMS ===
  airdrop_flare:
    # Basic item properties
    material: REDSTONE_TORCH
    name: "<gradient:#e74c3c:#f39c12><bold>📦 Airdrop Flare</bold></gradient>"
    lore:
      - "<gray>A signal flare that calls in"
      - "<gray>a supply drop from the sky"
      - ""
      - "<yellow>• <white>Calls airdrop to your location 🎯"
      - "<yellow>• <white>5 minute cooldown ⏳"
      - "<yellow>• <white>Visible to all players 👀"
      - "<yellow>• <gold>Contains rare loot 💎"
      - ""
      - "<red>Right-click to activate"
      - "<gold>Use wisely - others will see it!"
    custom-model-data: 2005
    
    # Custom item behavior settings
    behavior:
      type: AIRDROP_FLARE
      
      # Airdrop settings
      cooldown: 300          # Seconds (5 minutes)
      delay: 30              # Seconds until airdrop arrives
      
      # Airdrop contents
      loot-tier: "airdrop"
      item-count-min: 5
      item-count-max: 10
      
      # Visual/audio effects
      smoke-trail: true
      sound-effects: true
      announcement: true
      
    # Loot table integration - Updated to use tier-weights
    loot:
      enabled: true
      tier-weights:
        common: 0.5         # Very rare in basic chests
        uncommon: 3.0       # Uncommon in mid-tier
        rare: 8.0           # More common in rare chests
      min-amount: 1
      max-amount: 1
      
    # Persistent data for identification
    persistent-data:
      item-type: "custom_item"
      custom-id: "airdrop_flare"
      category: "utility"

# Integration settings
integration:
  # Chest loot integration
  chest-loot:
    enabled: true
    # Custom items will be automatically added to chest loot tables
    # based on their loot.tiers and loot.chance settings
    
  # Fishing loot integration  
  fishing-loot:
    enabled: false
    # Custom items can optionally be added to fishing loot
    # Set to true to enable custom items in fishing
    
  # Statistics tracking
  statistics:
    track-usage: true
    track-kills-with-item: true
    track-damage-dealt: true

# Performance settings
performance:
  # Maximum number of custom items that can exist at once
  max-items-per-game: 50
  
  # Cleanup interval for expired effects (in ticks)
  cleanup-interval: 200  # 10 seconds
  
  # Whether to use async processing for heavy operations
  async-processing: true
  
  # Maximum concurrent custom item operations
  max-concurrent-operations: 10
  
  # Cache size for custom item lookups
  cache-size: 500
  
  # Enable debug logging for custom items
  debug-logging: true
  
  # Cleanup orphaned custom items on server restart
  cleanup-on-restart: true 